<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/type-trail/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeTrail - Improve Your Typing Skills</title>
    <style>
      /* Hide content until theme is applied */
      html:not([data-theme]) {
        visibility: hidden;
      }
      /* Dark theme defaults */
      html {
        background: #1f2937;
        color: #f3f4f6;
      }
    </style>
    <script>
      // Immediately set the theme before the page renders
      (function() {
        try {
          const theme = localStorage.getItem('typetrail-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          // Force a repaint to prevent flash
          document.documentElement.style.display = 'none';
          requestAnimationFrame(() => {
            document.documentElement.style.display = '';
          });
        } catch (e) {
          // If localStorage fails, default to dark theme
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/type-trail/assets/index-B0PEjavm.js"></script>
    <link rel="stylesheet" crossorigin href="/type-trail/assets/index-_Az_vwgd.css">

  <body>
    <div id="root"></div>
  </body>
</html>
